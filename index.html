<!doctype html>
<html>
  <head>
    <title>DevOps Demo</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
        text-align: center;
      }

      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        animation: fadeIn 2s ease-in;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        animation: slideDown 1.5s ease;
      }

      p {
        font-size: 1.5rem;
        margin-bottom: 20px;
        animation: fadeIn 3s ease-in;
      }

      .badge {
        background: #00c9a7;
        padding: 10px 20px;
        border-radius: 20px;
        font-weight: bold;
        animation: pulse 2s infinite;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideDown {
        from {
          transform: translateY(-50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🚀 DevOps CI/CD Demo</h1>
      <p>Version 2 - CI/CD is working</p>
      <div class="badge">✔ Auto Deployed with GitHub Actions</div>
    </div>
  </body>
</html>
